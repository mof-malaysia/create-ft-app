# The only gate (there is no CI); see AGENTS.md. Turbo decides what reruns.
pre-commit:
  piped: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,mjs,cjs,json,jsonc,md,css,yml,yaml}"
      run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    - name: check
      run: pnpm run check --output-logs=errors-only && git add dist

pre-push:
  jobs:
    - name: verify
      run: pnpm run verify --output-logs=errors-only
